<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엔터프라이즈 시스템 워크시트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#1b2a4a;--gold:#b98a3d;--bg:#f5f6f9;--card:#fff;--fg:#1d2433;--muted:#5d6679;--line:#dde1ea;--tint:#f6efe1;--ok:#2f7a55;--warn:#a3621b;--bad:#b2453b;
--erp:#2c5aa0;--erpb:#e7eef9;--scm:#2f7a55;--scmb:#e5f3ec;--crm:#a3501b;--crmb:#fbece2;--app:#6b4fa0;--appb:#efe9f8;--ex:#8a93a6;
--f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161f;--card:#19202c;--fg:#e6e9f0;--muted:#9aa3b5;--line:#2b3444;--tint:#2a241a;--ok:#6cc394;--warn:#e0a659;--bad:#ec8a80;
--erp:#8db4f0;--erpb:#1c2a42;--scm:#79c9a0;--scmb:#183327;--crm:#eaa274;--crmb:#3a2416;--app:#bba3ea;--appb:#2a2240;--ex:#7d869a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161f;--card:#19202c;--fg:#e6e9f0;--muted:#9aa3b5;--line:#2b3444;--tint:#2a241a;--ok:#6cc394;--warn:#e0a659;--bad:#ec8a80;--erp:#8db4f0;--erpb:#1c2a42;--scm:#79c9a0;--scmb:#183327;--crm:#eaa274;--crmb:#3a2416;--app:#bba3ea;--appb:#2a2240;--ex:#7d869a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:#1b2a4a;color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
h1{font-size:1.08rem;font-weight:800;margin:0}
.sync{font-size:12px;margin-left:auto;opacity:.9}
.sync.bad{color:#ffb3a8;opacity:1;font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.barlab{font-size:12px;opacity:.9}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#1b2a4a}
.tabs button.done::after{content:" ✓"}
main.wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
h2{font-size:1.2rem;margin:0 0 6px;line-height:1.4}
h3{font-size:1.02rem;margin:14px 0 6px}
p{margin:6px 0}
.lead{font-size:15px}
.mut{color:var(--muted);font-size:14px}
.order{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.now{font-weight:800;color:var(--warn);font-size:14px;margin:8px 0 4px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;margin-top:8px}
.flow span{border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--bg)}
.flow span.on{background:var(--gold);color:#1b2a4a;border-color:var(--gold);font-weight:800}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.tcard b{display:block;font-size:15px}.tcard small{color:var(--muted);font-size:12.5px;display:block;line-height:1.5}
.tcard.sel{border-color:var(--gold);background:var(--tint)}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 4px}
label.f em{font-style:normal;font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ex)}
.isex{color:var(--ex)!important;font-style:italic}
.req{border-color:var(--bad)!important}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.pri{background:#1b2a4a;color:#fff;border-color:#1b2a4a}
.btn.gold{background:var(--gold);color:#1b2a4a;border-color:var(--gold)}
.btn.sm{font-size:12.5px;padding:3px 9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
button.chip{cursor:pointer;font:inherit;font-size:12.5px;color:var(--fg)}
.z{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:0 7px}
.z.ERP{background:var(--erpb);color:var(--erp)}.z.SCM{background:var(--scmb);color:var(--scm)}.z.CRM{background:var(--crmb);color:var(--crm)}.z.APP{background:var(--appb);color:var(--app)}
.event{border-left:5px solid var(--gold);background:var(--tint);border-radius:8px;padding:12px 14px;font-size:15.5px}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cc{border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.cc b.t{font-size:17px;display:block}
.cc.ERP{background:var(--erpb)}.cc.ERP b.t{color:var(--erp)}.cc.SCM{background:var(--scmb)}.cc.SCM b.t{color:var(--scm)}.cc.CRM{background:var(--crmb)}.cc.CRM b.t{color:var(--crm)}
.key{border:2px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.ax{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--appb)}
.ax ul{margin:6px 0;padding-left:20px}.ax li{margin:3px 0;font-size:14.5px}
.src{font-size:12px;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.q .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.q .opts button{min-width:70px}
.q .opts button.ok{background:var(--scmb);border-color:var(--ok);color:var(--ok)}
.q .opts button.no{background:var(--crmb);border-color:var(--bad);color:var(--bad)}
.why{font-size:13.5px;margin-top:4px}
.tw{overflow-x:auto}
table.g{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.g th,table.g td{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
table.g th{background:var(--bg);font-size:13px}
table.g td input,table.g td select,table.g td textarea{font-size:14px;padding:6px}
.mine{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.others{font-size:14px}.others div{border-left:3px solid var(--line);padding-left:8px;margin:4px 0}
.by{font-size:11.5px;color:var(--muted)}
.okline{color:var(--ok);font-weight:700;font-size:14px}
.warnline{color:var(--warn);font-weight:700;font-size:14px}
.badline{color:var(--bad);font-weight:700;font-size:14px}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.map .col{border-radius:10px;padding:8px;min-height:120px}
.map .col h4{margin:0 0 6px;font-size:14px}
.map .col.ERP{background:var(--erpb)}.map .col.ERP h4{color:var(--erp)}
.map .col.SCM{background:var(--scmb)}.map .col.SCM h4{color:var(--scm)}
.map .col.CRM{background:var(--crmb)}.map .col.CRM h4{color:var(--crm)}
.map .bx{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0;font-size:13px;line-height:1.5}
.map .bx i{font-style:normal;display:inline-block;min-width:20px;height:20px;border-radius:50%;background:#1b2a4a;color:#fff;text-align:center;font-size:12px;line-height:20px;margin-right:4px}
.map .app{grid-column:1/-1;background:var(--appb);border-radius:10px;padding:6px 8px}
.map .sd{grid-column:1/-1;border:2px dashed var(--gold);border-radius:10px;padding:8px}
.ovt{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.ovt td,.ovt th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.pbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;min-width:90px}.pbar i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:3px;flex-wrap:wrap}.dots span{width:13px;height:13px;border-radius:3px;background:var(--line)}.dots span.y{background:var(--ok)}
.big .ovt{font-size:20px}.big .pbar{height:16px}
.check li{margin:4px 0}
.hide{display:none!important}
.note{font-size:13px;background:var(--tint);border-radius:8px;padding:8px 10px}
@media (max-width:640px){table.g.stk{min-width:0}table.g.stk tr:first-child{display:none}table.g.stk tr{display:block;border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:6px 8px}table.g.stk td{display:block;border:0;padding:3px 0}table.g.stk td.no{font-weight:800;color:var(--warn)}table.g.stk td.no::before{content:'줄 '}table.g.stk td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted);font-weight:700}h1{font-size:.98rem}.barlab{font-size:11px}.card{padding:14px}.map{grid-template-columns:1fr}h2{font-size:1.1rem}}
@media print{header.top,.tabs,.btn{display:none!important}}
.dg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--card)}
.dg-cap{font-size:13px;font-weight:700;margin-bottom:8px}
.dg-b{border-radius:8px;padding:8px 10px;border:1px solid var(--line);text-align:center;min-width:0}
.dg-b b{display:block;font-size:14px}.dg-b small{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.dg-b.ERP{background:var(--erpb)}.dg-b.ERP b{color:var(--erp)}.dg-b.SCM{background:var(--scmb)}.dg-b.SCM b{color:var(--scm)}.dg-b.CRM{background:var(--crmb)}.dg-b.CRM b{color:var(--crm)}
.dg-b.big{border:2px solid var(--erp)}.dg-b .z{margin-bottom:3px}
.dg-ar{align-self:center;text-align:center;font-size:20px;color:var(--muted);line-height:1}.dg-ar small{display:block;font-size:11px}
.hub,.scm,.crm,.ord{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}.hub>.dg-b,.scm>.dg-b,.crm>.dg-b,.ord>.dg-b{flex:1 1 120px}
.erp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.erp .db{grid-column:1/-1;border:2px dashed var(--erp);border-radius:8px;padding:8px;text-align:center;font-weight:700;color:var(--erp)}.erp .db small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.flows{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.inside{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:8px 0}.inside ul{margin:4px 0 0 16px;padding:0;font-size:13px}
.exw td.why{font-size:12px;color:var(--muted)}.exw .z,.dg-b .z{white-space:nowrap}
@media (max-width:560px){.dg-ar{flex-basis:100%;transform:rotate(90deg);height:18px}.dg-ar small{transform:rotate(-90deg)}.erp{grid-template-columns:repeat(2,1fr)}}
.cimg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}.terms .dg-b{text-align:left}.terms .dg-b p{margin:4px 0 0;font-size:13px;line-height:1.55}.terms .ex{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
